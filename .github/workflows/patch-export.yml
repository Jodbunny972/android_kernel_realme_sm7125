name: Export Upstream Patches (4.14.323 → 4.14.357)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Fetch upstream and export patches
      run: |
        git fetch https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git v4.14.357
        mkdir -p patches/upstream
        git format-patch v4.14.323..v4.14.357 -o patches/upstream/
    
    - name: Upload patches as artifact
      uses: actions/upload-artifact@v3
      with:
        name: upstream-patches
        path: patches/upstream/
