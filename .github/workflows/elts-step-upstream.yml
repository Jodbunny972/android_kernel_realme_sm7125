name: Step-by-Step LTS Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sequential_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bunny-UP Branch
        uses: actions/checkout@v4
        with:
          ref: Bunny-UP
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config --global user.name "JOD-BUNNY"
          git config --global user.email "jod_bunny07@gmail.com"

      - name: Add Official OpenELA Remote
        run: |
          # Official OpenELA repo
          git remote add openela https://github.com/openela/kernel-lts.git || true
          # Fetching all tags specifically from openela
          git fetch openela --tags

      - name: Merge v4.14.349 with Changes
        run: |
          echo "🚀 Merging OpenELA v4.14.349..."
          
          # OpenELA-তে ট্যাগগুলো v4.14.349-openela নামে থাকে
          # আমরা সেই ট্যাগটি মার্জ করবো যাতে অরিজিনাল কমিটগুলো আসে
          if git merge openela/v4.14.349-openela -m "LTS update to 4.14.349" --no-edit; then
             echo "✅ Merge Successful"
          else
             echo "❌ Conflict or Tag not found"
             echo "MERGE_CONFLICT=true" >> $GITHUB_ENV
             exit 1
          fi

      - name: Push to Bunny-UP
        if: env.MERGE_CONFLICT != 'true'
        run: |
          git push origin HEAD:Bunny-UP

