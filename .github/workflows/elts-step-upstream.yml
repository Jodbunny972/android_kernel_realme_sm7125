name: ELTS Upstream

on:
  workflow_dispatch:

jobs:
  elts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "JOD BUNNY"
          git config --global user.email "bot@users.noreply.github.com"

      - name: Add OpenELA remote
        run: |
          git remote add elts https://github.com/openela/kernel-lts.git || true
          git fetch elts

      - name: Merge ELTS branch
        run: |
          git checkout Bunny-UP
          git merge elts/linux-4.14.y --no-edit

      - name: Push changes
        run: |
          git push origin Bunny-UP
