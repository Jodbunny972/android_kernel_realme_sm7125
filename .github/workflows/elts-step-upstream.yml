name: Step-by-Step LTS Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sequential_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bunny-UP Branch
        uses: actions/checkout@v4
        with:
          ref: Bunny-UP
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config --global user.name "JOD-BUNNY"
          git config --global user.email "jod_bunny07@gmail.com"

      - name: Add Official OpenELA Remote
        run: |
          # Adding the official OpenELA LTS repo as specified
          git remote add openela https://github.com/openela/kernel-lts.git || true
          git fetch openela linux-4.14.y --tags

      - name: Merge v4.14.349 with Changes
        run: |
          echo "🚀 Merging Official LTS & OpenELA v4.14.349..."
          
          # Performing the merge for version 349 specifically
          # This includes all bug fixes and changes from 348 to 349
          git merge v4.14.349 -m "LTS update to 4.14.349" --no-edit || echo "MERGE_CONFLICT=true" >> $GITHUB_ENV

      - name: Push to Bunny-UP
        if: env.MERGE_CONFLICT != 'true'
        run: |
          git push origin HEAD:Bunny-UP
          
