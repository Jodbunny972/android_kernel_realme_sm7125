name: Step-by-Step LTS Upstream

on:
  push:
    branches:
      - Bunny-UP   # এই ব্রাঞ্চে কিছু পুশ করলেই অটো রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশনও থাকলো

permissions:
  contents: write

jobs:
  upstream_350:
    runs-on: ubuntu-latest
    # লুপ এড়ানোর জন্য এটি ব্যবহার করা ভালো যাতে অ্যাকশন নিজেই নিজেকে ট্রিগার না করে
    if: "!contains(github.event.head_commit.message, 'Pure Upstream')"
    
    steps:
      - name: Checkout Bunny-UP Branch
        uses: actions/checkout@v4
        with:
          ref: Bunny-UP
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config --global user.name "JOD-BUNNY"
          git config --global user.email "jod_bunny07@gmail.com"

      - name: Fetch and Merge v4.14.350
        run: |
          git remote add openela https://github.com/openela/kernel-lts.git || true
          
          echo "🚀 Fetching Official OpenELA v4.14.350-openela..."
          git fetch openela refs/tags/v4.14.350-openela
          
          echo "🚀 Merging updates from 349 to 350..."
          # '-X theirs' স্ট্র্যাটেজি যাতে কনফ্লিক্ট নিজে নিজেই সমাধান হয়
          git merge FETCH_HEAD -m "LTS update to 4.14.350" --no-edit -X theirs || true
          
          # Modify/Delete কনফ্লিক্ট ক্লিন করা
          git add -u .
          git rm $(git diff --name-only --diff-filter=U) || true
          
          if git commit -m "LTS update to 4.14.350 (Pure Upstream)"; then
             echo "✅ Success: 4.14.350 merged!"
          else
             echo "ℹ️ Already up to date."
          fi

      - name: Push to Bunny-UP
        run: |
          git push origin HEAD:Bunny-UP

