name: Step-by-Step LTS Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sequential_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bunny-UP Branch
        uses: actions/checkout@v4
        with:
          ref: Bunny-UP
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config --global user.name "JOD-BUNNY"
          git config --global user.email "jod_bunny07@gmail.com"

      - name: Fetch and Merge v4.14.349
        run: |
          # Adding OpenELA official repo
          git remote add openela https://github.com/openela/kernel-lts.git || true
          
          echo "🚀 Fetching Official OpenELA tag..."
          # সরাসরি নির্দিষ্ট ট্যাগটি ফেচ করা হচ্ছে
          git fetch openela refs/tags/v4.14.349-openela
          
          echo "🚀 Merging updates from Original Authors..."
          # FETCH_HEAD ব্যবহার করলে গিট অটোমেটিক লেটেস্ট ফেচ করা ডেটা খুঁজে পায়
          if git merge FETCH_HEAD -m "LTS update to 4.14.349" --no-edit; then
             echo "✅ Success: 4.14.349-openela merged!"
          else
             echo "❌ Error: Merge conflict detected"
             exit 1
          fi

      - name: Push to Bunny-UP
        run: |
          git push origin HEAD:Bunny-UP
