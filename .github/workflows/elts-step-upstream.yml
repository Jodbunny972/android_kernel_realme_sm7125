name: Step-by-Step LTS Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sequential_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bunny-UP Branch
        uses: actions/checkout@v4
        with:
          ref: Bunny-UP
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config --global user.name "JOD-BUNNY"
          git config --global user.email "jod_bunny07@gmail.com"

      - name: Fetch and Merge v4.14.349
        run: |
          git remote add openela https://github.com/openela/kernel-lts.git || true
          
          echo "🚀 Fetching Official OpenELA v4.14.349-openela..."
          git fetch openela refs/tags/v4.14.349-openela
          
          echo "🚀 Merging with 'theirs' strategy to avoid manual conflicts..."
          # '-X theirs' কমান্ডটি কনফ্লিক্ট হলে অটোমেটিক আপস্ট্রিমের কোড গ্রহণ করবে
          if git merge FETCH_HEAD -m "LTS update to 4.14.349" --no-edit -X theirs; then
             echo "✅ Success: 4.14.349-openela merged perfectly!"
          else
             echo "❌ Unexpected error during merge"
             exit 1
          fi

      - name: Push to Bunny-UP
        run: |
          git push origin HEAD:Bunny-UP

