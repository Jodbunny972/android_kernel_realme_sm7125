name: Step-by-Step LTS Upstream

on:
  push:
    branches:
      - Bunny-UP
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upstream_354:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Pure Upstream')"
    
    steps:
      - name: Checkout Bunny-UP Branch
        uses: actions/checkout@v4
        with:
          ref: Bunny-UP
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Config
        run: |
          git config --global user.name "JOD-BUNNY"
          git config --global user.email "jod_bunny07@gmail.com"

      - name: Fetch and Merge v4.14.354
        run: |
          git remote add openela https://github.com/openela/kernel-lts.git || true
          
          git fetch openela refs/tags/v4.14.354-openela
          
          git merge FETCH_HEAD -m "LTS update to 4.14.354" --no-edit -X theirs || true
          
          git add -u .
          git rm $(git diff --name-only --diff-filter=U) || true
          
          if git commit -m "LTS update to 4.14.354 (Pure Upstream)"; then
             echo "Success: 4.14.354 merged!"
          else
             echo "Already up to date."
          fi

      - name: Push to Bunny-UP
        run: |
          git push origin HEAD:Bunny-UP

